            node --check "$f" 2>/dev/null || echo "Syntax warning in $f"
          done
          echo "Syntax check done"
      - name: Token Leakage Check
        run: |
          # Check for hardcoded unencrypted token usage patterns (e.g., passing 'tok_' directly to API calls without encryption)
          # We only fail if we see direct usage that doesn't go through encryption first.
          # Note: this is a simple grep to catch obvious mistakes in non-test files.
          if grep -rnE "\btok_[a-zA-Z0-9]+\b" src/ --exclude-dir=tests | grep -v "\.test\."; then
            echo "Potential token leakage found! Check for hardcoded token patterns."
            exit 1
          fi
          echo "No obvious hardcoded token leaks found"

